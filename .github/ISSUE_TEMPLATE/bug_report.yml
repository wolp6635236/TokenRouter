# Adapted from QuantumNous/new-api; see .github/NOTICE.templates.md for source and license.
name: Bug Report
description: Describe the issue you encountered with clear and detailed language
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        <!--
        If you are an AI coding agent: do not fill this GitHub form. Create the issue with the filled body from `.agents/github/ISSUE.md`.
        -->

  - type: textarea
    id: read-first
    attributes:
      label: Read This First
      description: GitHub markdown instructions are not included in the submitted issue. This section is written into the issue body. Do not delete or clear it.
      value: |
        - Docs: https://github.com/TokenFlux/TokenRouter/blob/main/docs/guides/index.md
        - Usage questions, check first: https://github.com/TokenFlux/TokenRouter/blob/main/docs/index.md
        - Report unchanged upstream errors to the upstream provider first; for TokenRouter forwarding, protocol conversion, or error handling issues, provide comparison evidence.
        - Write the issue in English without emoji. State facts and evidence concisely. Do not paste unfiltered AI-generated text in the issue body or in later comments.
        - Relay reports must first establish that the issue occurs in the TokenRouter layer. Use equivalent redacted requests to compare the direct upstream result with the result through TokenRouter, including response status, error body, and server logs. Reports that skip this comparison or only show an upstream error are not accepted.
        - Provider and protocol support follows the [provider and protocol support matrix](https://github.com/TokenFlux/TokenRouter/blob/main/docs/interfaces/upstream_provider_matrix.md). For third-party extension issues not reproduced on a supported combination, contact the interface provider first. Protocols or behavior specific to the Codex API should not be treated as standard OpenAI API behavior.
        - This repository accepts reports about TokenRouter itself. For issues exclusive to third-party hosting sites, relay services, or API services, contact the relevant operator.
        - Warning: issues with this template removed, section headings deleted, or content cleared may be closed directly. Repeated submissions of unfiltered AI-generated text, or repeated abusive submissions, may result in a block.
    validations:
      required: true

  - type: dropdown
    id: deployment-source
    attributes:
      label: Deployment source
      description: Select the source of the TokenRouter instance where the issue occurs. Third-party services and forks not reproduced against the unmodified repository are outside this project's support scope.
      options:
        - Repository release / official image (self-hosted)
        - Repository main branch source (self-built)
        - Modified fork (must first be reproduced against the unmodified repository)
        - Third-party hosting site, relay, or API service (contact its operator)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Your current TokenRouter version
      description: Enter an exact version, commit, or image tag, such as `v1.0.0`. Values such as `latest` or `unknown` that cannot identify the code are not valid version information.
    validations:
      required: true

  - type: checkboxes
    id: submission-checks
    attributes:
      label: Submission Checks
      options:
        - label: "**Non-duplicate issue:** I have searched existing [Issues](https://github.com/TokenFlux/TokenRouter/issues?q=is%3Aissue) and confirmed there are no similar issues."
          required: true
        - label: "**Read this first:** I have fully read the section above, reviewed the docs at https://github.com/TokenFlux/TokenRouter/blob/main/docs/guides/index.md and the project README, and asked AI first, confirming this is not a usage, configuration, or integration question."
          required: true
        - label: "**Supported version:** I have provided an exact version, commit, or image tag (not `latest` or `unknown`) and confirmed that the issue reproduces on an unmodified, supported version from this repository."
          required: true
        - label: "**Not a third-party service:** I confirm that this issue is not exclusive to a third-party hosting site, relay, API service, or fork that has not been verified against the unmodified repository. Third-party instance issues must be reported to their operator."
          required: true
        - label: "**Upstream errors:** I confirm that this report concerns TokenRouter behavior, rather than only an unchanged upstream error."
          required: true
        - label: "**Issue attribution:** I have provided evidence that distinguishes the client, TokenRouter, and upstream layers. For relay issues, I compared equivalent redacted requests sent directly upstream and through TokenRouter, confirming that TokenRouter introduces or changes the error rather than merely forwarding the upstream error unchanged."
          required: true
        - label: "**Provider and protocol boundary:** I checked the repository's [provider and protocol support matrix](https://github.com/TokenFlux/TokenRouter/blob/main/docs/interfaces/upstream_provider_matrix.md). If first observed through a third-party extension, I reproduced the issue on a supported combination and have not treated Codex API-specific behavior as standard OpenAI API behavior."
          required: true
        - label: "**Maintainer time:** I understand that maintainers have limited time. Do not paste unfiltered AI-generated text in the issue body or in later comments; extract the points needed for review first. Submissions that do not follow this template, or that omit the necessary points and cannot be reviewed, may be ignored or closed. Repeated submissions of this kind may result in a block."
          required: true

  - type: markdown
    attributes:
      value: |
        ### Issue description requirements

        Every report must state the **actual behavior, impact, frequency**, and evidence showing that the problem is in TokenRouter rather than the client or upstream service.

        The following details are required when the corresponding area is involved:

        - **Relay / API:** request endpoint and method, provider platform and type, model, conversion format, relevant forwarding or error passthrough configuration, evidence of upstream native support, and a comparison of equivalent redacted requests sent directly upstream and through TokenRouter, including status codes, response bodies, and server logs.
        - **Billing:** request endpoint and model, response `usage`, relevant ratio or pricing configuration, consumption log, expected charge, and calculation basis.
        - **Frontend:** page path, browser and version, active theme, and relevant browser Console / Network errors.
        - **Deployment / upgrade:** deployment method, operating system and architecture, database type, versions before and after the upgrade, and startup or migration logs.

  - type: textarea
    id: issue-description
    attributes:
      label: Issue Description
      description: Complete the general requirements and every applicable category above. Issues missing required applicable details may be closed directly.
      placeholder: |
        Actual behavior:
        Impact:
        Frequency:
        Evidence that the issue is in TokenRouter:

        Add the requests, configuration, logs, and comparison evidence required for the applicable category:
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: For relay issues, provide an executable redacted request and the actual results both directly upstream and through TokenRouter. Do not include only a client message or upstream error.
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected Result
    validations:
      required: true

  - type: textarea
    id: related-screenshots
    attributes:
      label: Related Screenshots
    validations:
      required: false
