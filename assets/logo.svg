<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  role="img"
  aria-labelledby="title desc"
>
  <!--
    logo.svg renders the TokenRouter brand mark on a dark carrier.
    Paired concentric arcs keep the channel six grid units wide through each
    turn. Rotating the upper shape by 180 degrees gives both openings matching
    geometry and preserves the mark's rotational symmetry.
  -->
  <title id="title">TokenRouter</title>
  <desc id="desc">Two cyan shapes frame a constant-width route with rounded internal turns.</desc>
  <rect width="32" height="32" rx="7" fill="#0B1220" />
  <g fill="#00D2FF">
    <path d="
        M7 2
        H25
        A5 5 0 0 1 30 7
        H25.727922
        A12 12 0 0 0 17.242641 10.514719
        L10.514719 17.242641
        A6 6 0 0 1 6.272078 19
        H2
        V7
        A5 5 0 0 1 7 2
        Z
      " />
    <path transform="rotate(180 16 16)" d="
        M7 2
        H25
        A5 5 0 0 1 30 7
        H25.727922
        A12 12 0 0 0 17.242641 10.514719
        L10.514719 17.242641
        A6 6 0 0 1 6.272078 19
        H2
        V7
        A5 5 0 0 1 7 2
        Z
      " />
  </g>
</svg>
